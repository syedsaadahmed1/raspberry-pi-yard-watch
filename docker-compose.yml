name: pi-yard-watch

services:
  frigate:
    container_name: frigate
    image: "${FRIGATE_IMAGE:-ghcr.io/blakeblackshear/frigate:stable}"
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "${FRIGATE_SHM_SIZE:-128mb}"
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: "${FRIGATE_CACHE_SIZE:-536870912}"
    ports:
      - "8971:8971"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      TZ: "${TZ:-Etc/UTC}"
